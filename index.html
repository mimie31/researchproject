<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquaponics Tilapia Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        header { background-color: #065f46; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 1fr 2fr; } }
        .card { border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; background: #ffffff; }
        .slider-box { margin-bottom: 15px; }
        .slider-box label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        input[type="range"] { w-full; width: 100%; cursor: pointer; }
        .hud-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; text-align: center; }
        .metric { background: #f1f5f9; padding: 10px; border-radius: 6px; }
        .metric span { display: block; font-size: 20px; font-weight: bold; color: #0f172a; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 style="margin:0; font-size: 24px;">Aquaponics Tilapia Supply Simulator</h1>
            <p style="margin:5px 0 0 0; font-size: 13px;">SFM: Food Security & Growth Derivative Model</p>
        </header>

        <div class="grid">
            <div class="card">
                <h3 style="margin-top:0; color:#065f46;">Faktor Persekitaran</h3>
                
                <div class="slider-box">
                    <label>Berat Maksimum (Wmax): <span id="wVal" style="color:#059669;">800g</span></label>
                    <input type="range" id="wSlider" min="600" max="1000" step="50" value="800">
                </div>

                <div class="slider-box">
                    <label>Kadar Tumbesaran (k): <span id="kVal" style="color:#059669;">0.055</span></label>
                    <input type="range" id="kSlider" min="0.040" max="0.070" step="0.005" value="0.055">
                </div>

                <div class="slider-box">
                    <label>Kualiti Air (Index &eta;): <span id="eVal" style="color:#059669;">1.00</span></label>
                    <input type="range" id="eSlider" min="0.70" max="1.15" step="0.05" value="1.00">
                </div>

                <hr style="border:0; border-top:1px solid #e2e8f0; margin:20px 0;">

                <div class="slider-box">
                    <label style="color:#2563eb;">Pilih Hari Paparan Data:</label>
                    <input type="range" id="daySlider" min="0" max="120" step="5" value="60">
                    <div style="text-align:center; font-weight:bold; margin-top:5px; color:#2563eb;" id="dayLabel">Hari 60</div>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0; color:#334155;">Live Trajectory Graf</h3>
                
                <div style="height: 280px; width: 100%; position: relative;">
                    <canvas id="chartKu"></canvas>
                </div>

                <div class="hud-box">
                    <div class="metric">
                        <small style="font-size:10px; color:#64748b;">BERAT f(x)</small>
                        <span id="hudW">0</span><small>g</small>
                    </div>
                    <div class="metric">
                        <small style="font-size:10px; color:#64748b;">DERIVATIF f'(x)</small>
                        <span id="hudD">0</span><small>g/hari</small>
                    </div>
                    <div class="metric">
                        <small style="font-size:10px; color:#64748b;">STATUS FASA</small><span id="hudS" style="font-size:14px; color:#b45309; padding-top:5px;">Loading</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ambil elemen HTML
        const wSlider = document.getElementById('wSlider');
        const kSlider = document.getElementById('kSlider');
        const eSlider = document.getElementById('eSlider');
        const daySlider = document.getElementById('daySlider');

        const wVal = document.getElementById('wVal');
        const kVal = document.getElementById('kVal');
        const eVal = document.getElementById('eVal');
        const dayLabel = document.getElementById('dayLabel');

        const hudW = document.getElementById('hudW');
        const hudD = document.getElementById('hudD');
        const hudS = document.getElementById('hudS');

        const beta = 90; // Nilai tetap model asal

        // Formula Fungsi Asal f(x)
        function formulaFX(x, Wmax, k, eta) {
            return Wmax / (1 + beta * Math.exp(- (k * eta) * x));
        }

        // Formula Pembezaan Terbitan Pertama f'(x)
        function formulaDX(x, Wmax, k, eta) {
            const ke = k * eta;
            const eTerm = Math.exp(-ke * x);
            return (Wmax * beta * ke * eTerm) / Math.pow(1 + beta * eTerm, 2);
        }

        // Sediakan Kanvas Graf
        const ctx = document.getElementById('chartKu').getContext('2d');
        let myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Berat Ikan (g)', data: [], borderColor: '#2563eb', borderWidth: 3, yAxisID: 'y1', tension: 0.1, fill: false, pointRadius: 0 },
                    { label: 'Kadar Tumbesaran (g/hari)', data: [], borderColor: '#059669', borderWidth: 3, yAxisID: 'y2', tension: 0.1, fill: false, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y1: { type: 'linear', position: 'left', min: 0, max: 1100 },
                    y2: { type: 'linear', position: 'right', min: 0, max: 20, grid: { drawOnChartArea: false } }
                }
            }
        });

        // Fungsi Kemaskini Data Graf & Angka HUD
        function recalculate() {
            const Wmax = parseFloat(wSlider.value);
            const k = parseFloat(kSlider.value);
            const eta = parseFloat(eSlider.value);
            const day = parseInt(daySlider.value);

            // Update Label Teks Slider
            wVal.innerText = Wmax + "g";
            kVal.innerText = k.toFixed(3);
            eVal.innerText = eta.toFixed(2);
            dayLabel.innerText = "Hari " + day;

            // Generate Array Data untuk 120 Hari
            const daysLabels = [];
            const weightData = [];
            const rateData = [];

            for (let d = 0; d <= 120; d += 2) {
                daysLabels.push(d);
                weightData.push(formulaFX(d, Wmax, k, eta));
                rateData.push(formulaDX(d, Wmax, k, eta));
            }

            // Kemaskini Graf
            myChart.data.labels = daysLabels;
            myChart.data.datasets[0].data = weightData;
            myChart.data.datasets[1].data = rateData;
            myChart.update();

            // Kemaskini HUD Angka
            const currentW = formulaFX(day, Wmax, k, eta);
            const currentD = formulaDX(day, Wmax, k, eta);

            hudW.innerText = Math.round(currentW);
            hudD.innerText = currentD.toFixed(1);

            // Tentukan Status Fasa
            if (day <= 35) { hudS.innerText = "Starter"; }
            else if (day <= 75) { hudS.innerText = "Grower"; }
            else if (day <= 105) { hudS.innerText = "Finisher"; }
            else { hudS.innerText = "Tuan/Harvest"; }
        }

        // Pasang Event Listener pada Slider
        wSlider.addEventListener('input', recalculate);
        kSlider.addEventListener('input', recalculate);
        eSlider.addEventListener('input', recalculate);
        daySlider.addEventListener('input', recalculate);

        // Jalankan pengiraan kali pertama secara automatik
        recalculate();
    </script>
</body>
</html>
